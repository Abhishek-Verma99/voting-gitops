apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result
  labels:
    {{- include "voting.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.hostnames.result }}
  rules:
    - backendRefs:
        - name: result
          port: 80
