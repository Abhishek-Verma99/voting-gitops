apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    {{- include "voting.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.result.replicas }}
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
        - name: result
          image: "{{ .Values.result.image.repository }}:{{ .Values.result.image.tag }}"
          ports:
            - containerPort: {{ .Values.result.port }}
          resources:
            {{- toYaml .Values.result.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: {{ .Values.result.port }}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.result.port }}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.result.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
