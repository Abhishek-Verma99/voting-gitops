apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    {{- include "voting.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - port: {{ .Values.db.port }}
      targetPort: {{ .Values.db.port }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    {{- include "voting.labels" . | nindent 4 }}
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - containerPort: {{ .Values.db.port }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.db.storageClass }}
        resources:
          requests:
            storage: {{ .Values.db.storage }}
